[project]
name = "comfort-creature"
version = "0.1.0"
description = "An autonomous navigation system for robotic wheelchairs"
requires-python = ">=3.10"

[tool.ruff.lint]
select = ["E", "F", "I"]  # Errors, pyflakes, import sorting

[tool.ruff.lint.per-file-ignores]
"robot/utils/configure_odrive.py" = ["F405"]  # ODrive uses star imports

[tool.ruff.lint.isort]
known-first-party = ["geometry", "utils"]

[tool.mypy]
python_version = "3.10"
mypy_path = "robot"

[[tool.mypy.overrides]]
module = ["RPi.*", "gpiozero.*", "odrive.*"]
ignore_missing_imports = true
